name: "Changes.Watch upgrade verdict"
description: "Comment on pull requests with an evidence-backed verdict for every npm dependency change: install, wait, skip or avoid."
author: "Changes.Watch"
branding:
  icon: "shield"
  color: "blue"
inputs:
  github-token:
    description: "Token used to read the lockfile at the PR base and head and to write one PR comment. Needs pull-requests: write and contents: read."
    required: false
    default: ${{ github.token }}
  lockfile:
    description: "Path to package-lock.json (lockfile v2 or v3) relative to the repository root."
    required: false
    default: "package-lock.json"
  fail-on:
    description: "Fail the check when a dependency change gets this verdict: none or avoid."
    required: false
    default: "none"
  comment:
    description: "Post or update one sticky PR comment (true) or only write the job summary (false)."
    required: false
    default: "true"
  telemetry:
    description: "Send an anonymous install id (salted SHA-256 of the repository id) so Changes.Watch can count active installs. Set to false to opt out."
    required: false
    default: "true"
  api-url:
    description: "Changes.Watch base URL."
    required: false
    default: "https://www.changes.watch"
outputs:
  changed-count:
    description: "Number of changed npm package versions."
  avoid-count:
    description: "Number of changes with an avoid verdict."
  comment-url:
    description: "URL of the PR comment, when one was written."
runs:
  using: "node24"
  main: "dist/index.js"
